# Keep systemd's "[ OK ] Started ..." unit status off the console.
#
# greetd starts on vt1 the moment systemd-user-sessions.service is up, which is
# a second or so before the last units of graphical.target finish. Those units
# log to /dev/console -- also vt1 -- so their status lines land on top of the
# greeter tuigreet has already painted, and tuigreet's next clock tick repaints
# around them. The result looks like the greeter drawing twice with boot log
# wedged into it.
#
# The kernel cmdline gets `quiet` for the same reason (see setup_arch.sh), but
# that only covers bootloader entries that exist when the script runs; a kernel
# installed later brings in a fresh unpatched entry. This drop-in is where the
# suppression actually lives, independent of bootloader and entry churn.
[Manager]
ShowStatus=no
