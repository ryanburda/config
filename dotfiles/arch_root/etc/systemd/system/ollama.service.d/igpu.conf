# Let ollama use the integrated GPU.
#
# ollama discovers the Intel Arc iGPU through its Vulkan backend and then
# deliberately discards it -- "dropping integrated GPU; to enable, set
# OLLAMA_IGPU_ENABLE=1". The default is aimed at machines where the iGPU sits
# next to a discrete card and is the worse of the two. This laptop has no
# discrete GPU, so the choice is iGPU or nothing, and without this drop-in
# every model silently runs on CPU.
#
# Nothing about it is fatal if the iGPU misbehaves: ollama falls back to CPU on
# its own, and 62 GB of system RAM makes that a slow but working path.
[Service]
Environment=OLLAMA_IGPU_ENABLE=1
