# Only the 16 ANSI slots (0-15) and `reset` are used here, so lsd follows the terminal's theme.
# `reset` is the terminal's default foreground, i.e. that same theme's `foreground` key.
#
# These numbers are usage ranks, not hues. colorschemes.lua sorts slots 1-7 (and
# 9-15) by how much of a screenful of code each color paints, so slot 1 is the
# dominant color in every palette and slot 7 the least-used. Picking a number
# here picks a rank.

user: reset
group: reset

permission:
  read: 5
  write: 5
  exec: 5
  exec-sticky: 4
  no-access: reset
  octal: 5
  acl: 4
  context: 4

date:
  hour-old: 4
  day-old: 4
  older: 4

size:
  none: reset
  small: 10
  medium: 2
  large: 7

inode:
  valid: 12
  invalid: reset

links:
  valid: 12
  invalid: reset

tree-edge: reset

git-status:
  default: reset
  unmodified: reset
  ignored: reset
  new-in-index: 1
  new-in-workdir: 1
  typechange: 2
  deleted: 7
  renamed: 1
  modified: 2
  conflicted: 7
