# Prefix
unbind C-b
unbind Space
set-option -g prefix C-Space

# Agent radar (Run this before setting status)
set-option -g @agent-radar-popup-width 40%
set-option -g @agent-radar-popup-height 35%
run-shell ~/.git/vieitesss/agent-radar/agent-radar.tmux

# Options
set-option -g default-terminal "${TERM}"
set-option -g status-position bottom
set-option -g status-style "fg=default,bg=colour0"
set-option -g message-style "bg=colour0,fg=colour6,fill=colour0"
set-option -g message-command-style "bg=colour0,fg=colour1,fill=colour0"
set-option -g automatic-rename off
set-option -g pane-border-lines heavy
set-option -g pane-border-indicators both
set-option -g pane-border-style "fg=colour0"
set-option -g pane-active-border-style "fg=colour1"
set-option -g popup-border-lines rounded
set-option -g detach-on-destroy off
set-option -s exit-unattached off
set-option -g display-time 2000
set-option -g repeat-time 500
set-option -g escape-time 0
set-option -g focus-events on
set-option -g mode-keys vi
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -as terminal-features ",*:RGB"
set-option -ag terminal-overrides ",xterm-256color:RGB"
set-option -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set-option -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors
set-window-option -g mouse on
# Status bar
set-option -g status-interval 10
set-option -g status-justify absolute-centre
set-option -g window-status-format " #[dim]#I:#W "
set-option -g window-status-current-format " #I:#W "
set-option -g window-status-current-style "bg=colour8"
set-option -g status-left-length 100
set-option -g status-right-length 100
set-option -g status-right '#[bg=colour8]#[fg=colour1] #(TZ=UTC date -u +%%H:%%M) #[fg=colour2]UTC#(date +%%z) '

# Keybinds
bind-key : command-prompt
bind-key ? list-keys
bind-key / source-file "${XDG_CONFIG_HOME}/tmux/tmux.conf" \; display "tmux conf reloaded!"
bind-key h attach-session -c "#{pane_current_path}"
bind-key j run-shell 'tmux-smart-split -v 78 22 -c "#{pane_current_path}"'
bind-key k copy-mode
bind-key l run-shell 'tmux-smart-split -h 65 35 -c "#{pane_current_path}"'
bind-key t new-window -c "#{pane_current_path}"
bind-key B break-pane
bind-key x kill-pane
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9
bind-key u popup -h 50% -w 50%
bind-key i select-window -t 1
bind-key o select-window -t 2
bind-key p select-window -t 3
bind-key -r , previous-window
bind-key -r . next-window
bind-key -r < swap-window -t -1 \; select-window -t -1
bind-key -r > swap-window -t +1 \; select-window -t +1
bind-key c run-shell "tmux-toggle-window docker lazydocker"
bind-key g run-shell "tmux-toggle-window git lazygit"
bind-key S popup -h 45% -w 45% -E "settings"
bind-key X kill-session
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

###########
# dirsesh #
###########
run-shell "dirsesh init"

set-option -g status-left '#[bg=colour8]#[fg=colour2] #{session_name}#[fg=colour1]#(branch=$(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null) && printf "@%%s" "$branch") #(dirsesh bookmark-status "#{session_path}")'

# pickers
bind-key d popup -h 35% -w 40% -E 'dirsesh at "$(dirsesh pick-dir)"'
bind-key f popup -h 35% -w 40% -E 'dirsesh at "$(dirsesh pick-repo)"'
bind-key F popup -h 35% -w 40% -E 'dirsesh at "$(dirsesh pick-repo -brief -fetch -filter)"'
bind-key w popup -h 35% -w 40% -E 'dirsesh at "$(dirsesh pick-worktree)"'
bind-key T popup -h 35% -w 40% -E 'dirsesh at "$(mktemp -d)"'

# bookmarks
bind-key m command-prompt -1 -p "Set bookmark:" "run-shell -b \"dirsesh bookmark-set '%%%'\""
bind-key M command-prompt -1 -p "Remove bookmark:" "run-shell -b \"dirsesh bookmark-remove '%%%'\""
bind-key \' command-prompt -1 -p "Go to bookmark:" 'run-shell -b "dirsesh at \"$(dirsesh bookmark-get \"%%%\")\""'
bind-key b popup -h 35% -w 40% -E 'dirsesh at "$(dirsesh bookmark-pick)"'

# session management
bind-key s popup -h 35% -w 40% -E "dirsesh session-switch"
bind-key \; run-shell -b "dirsesh session-last"
bind-key L run-shell "tmux-toggle-window dirsesh-logs dirsesh session-logs"
bind-key K popup -h 35% -w 40% -E "dirsesh session-kill"


################
# nvim-tmux-wm #
################
# NOTE: Update the path to match where you cloned this plugin (This should work for lazy.nvim)
#         |
#         V
# NVIM_TMUX_RESIZE_SCRIPT="$HOME/.local/share/nvim/lazy/nvim-tmux-wm/scripts/resize_tmux_pane.sh"
NVIM_TMUX_RESIZE_SCRIPT="$HOME/code/nvim-tmux-wm/base/scripts/resize_tmux_pane.sh"

# Set on the pane by the nvim-tmux-wm Neovim plugin.
is_vim="#{@pane-is-vim}"

# Navigation bindings
bind-key -n 'C-h' if-shell -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Resize bindings
bind-key -n 'M-h' if-shell -F "$is_vim" 'send-keys M-h' "run-shell -b '$NVIM_TMUX_RESIZE_SCRIPT h -3'"
bind-key -n 'M-H' if-shell -F "$is_vim" 'send-keys M-H' "run-shell -b '$NVIM_TMUX_RESIZE_SCRIPT h  3'"
bind-key -n 'M-j' if-shell -F "$is_vim" 'send-keys M-j' "run-shell -b '$NVIM_TMUX_RESIZE_SCRIPT j -1'"
bind-key -n 'M-J' if-shell -F "$is_vim" 'send-keys M-J' "run-shell -b '$NVIM_TMUX_RESIZE_SCRIPT j  1'"
bind-key -n 'M-k' if-shell -F "$is_vim" 'send-keys M-k' "run-shell -b '$NVIM_TMUX_RESIZE_SCRIPT k  1'"
bind-key -n 'M-K' if-shell -F "$is_vim" 'send-keys M-K' "run-shell -b '$NVIM_TMUX_RESIZE_SCRIPT k -1'"
bind-key -n 'M-l' if-shell -F "$is_vim" 'send-keys M-l' "run-shell -b '$NVIM_TMUX_RESIZE_SCRIPT l  3'"
bind-key -n 'M-L' if-shell -F "$is_vim" 'send-keys M-L' "run-shell -b '$NVIM_TMUX_RESIZE_SCRIPT l -3'"
####################
# end nvim-tmux-wm #
####################
